<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Generator App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Random Generator</h1>
        </header>
        
        <div class="tabs">
            <button class="tab active" id="password-tab-btn">Password</button>
            <button class="tab" id="name-tab-btn">Name</button>
            <button class="tab" id="username-tab-btn">Username</button>
            <button class="tab" id="business-tab-btn">Business</button>
        </div>
        
        <!-- Password Tab -->
        <div id="password-tab" class="tab-content active">
            <div class="options">
                <div class="option-group">
                    <label>Password Length:</label>
                    <input type="number" id="pwd-length" min="8" max="128" value="16">
                </div>
                <div class="option-group">
                    <input type="checkbox" id="pwd-uppercase" checked>
                    <label class="checkbox-label">Include Uppercase</label>
                </div>
                <div class="option-group">
                    <input type="checkbox" id="pwd-lowercase" checked>
                    <label class="checkbox-label">Include Lowercase</label>
                </div>
                <div class="option-group">
                    <input type="checkbox" id="pwd-numbers" checked>
                    <label class="checkbox-label">Include Numbers</label>
                </div>
                <div class="option-group">
                    <input type="checkbox" id="pwd-symbols" checked>
                    <label class="checkbox-label">Include Symbols</label>
                </div>
            </div>
            <button class="generate" id="generate-password-btn">Generate Password</button>

            <div class="result-area">
                <div class="result" id="password-result">Click generate to create a password</div>
                <button class="copy" id="copy-password" disabled onclick="copyToClipboard('password-result')">Copy</button>
            </div>
        </div>
        
        <!-- Name Tab -->
        <div id="name-tab" class="tab-content">
            <div class="options">
                <div class="option-group">
                    <label>Name Type:</label>
                    <select id="name-type">
                        <option value="full">Full Name</option>
                        <option value="first">First Name</option>
                        <option value="last">Last Name</option>
                    </select>
                </div>
                <div class="option-group">
                    <label>Gender:</label>
                    <select id="name-gender">
                        <option value="any">Any</option>
                        <option value="male">Male</option>
                        <option value="female">Female</option>
                    </select>
                </div>
            </div>
            <button class="generate" onclick="generateName()">Generate Name</button>
            <div class="result-area">
                <div class="result" id="name-result">Click generate to create a name</div>
                <button class="copy" id="copy-name" disabled onclick="copyToClipboard('name-result')">Copy</button>
            </div>
        </div>
        
        <!-- Username Tab -->
        <div id="username-tab" class="tab-content">
            <div class="options">
                <div class="option-group">
                    <label>Style:</label>
                    <select id="username-style">
                        <option value="modern">Modern</option>
                        <option value="classic">Classic</option>
                        <option value="creative">Creative</option>
                    </select>
                </div>
                <div class="option-group">
                    <label>Max Length:</label>
                    <input type="number" id="username-length" min="5" max="30" value="15">
                </div>
            </div>
            <button class="generate" onclick="generateUsername()">Generate Username</button>
            <div class="result-area">
                <div class="result" id="username-result">Click generate to create a username</div>
                <button class="copy" id="copy-username" disabled onclick="copyToClipboard('username-result')">Copy</button>
            </div>
        </div>
        
        <!-- Business Tab -->
        <div id="business-tab" class="tab-content">
            <div class="options">
                <div class="option-group">
                    <label>Industry:</label>
                    <select id="business-industry">
                        <option value="general">General</option>
                        <option value="tech">Technology</option>
                        <option value="healthcare">Healthcare</option>
                        <option value="finance">Finance</option>
                        <option value="retail">Retail</option>
                    </select>
                </div>
            </div>
            <button class="generate" onclick="generateBusiness()">Generate Business Name</button>
            <div class="result-area">
                <div class="result" id="business-result">Click generate to create a business name</div>
                <button class="copy" id="copy-business" disabled onclick="copyToClipboard('business-result')">Copy</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
